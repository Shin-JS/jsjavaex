# Copy to the existing server classpath as sdx-ecr.properties (UTF-8).
# For the Create Action migration set JVM options (NOT properties file entries):
# -Dsdx.ecr.mode=trigger -Dsdx.ecr.targetType=sdxECChangeAction
# The trigger numbers policy sdxECR only; policy sdxECO is excluded.
# This file contains no operational counter IDs; fill from your existing environment.
# Target type: -Dsdx.ecr.targetType=sdxEcChangeAction (case-sensitive).
ecr.nextNumberAttribute=eService Next Number

# Query the full number namespace; restrict only when all relevant objects are covered.
ecr.query.typePattern=*
ecr.query.vaultPattern=*

# Division source: exact SERVER Context.getRole() mapping first, then Context.getUser().
# No organization string is inferred or split by the implementation.
# Escape ':' if your full credential contains ctx:: in a Java properties key.
# ecr.division.role.ctx\:\:VPLMProjectLeader.MX.DesignSpace=MX
# ecr.division.user.REAL_LOGIN_NAME=MX

# Existing, dedicated counters. Each ID must be unique to its division/date series.
# ecr.counter.W.20261020=REAL_EXISTING_COUNTER_ID
# ecr.counter.N.20261020=ANOTHER_EXISTING_COUNTER_ID
# Add the remaining actual series using the same format.
